<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prakash Electrical & Refrigeration</title>
<style>
body{margin:0;font-family:Arial;background:#f5f7fa;color:#222}header{background:#0b5cab;color:#fff;text-align:center;padding:18px}h1{margin:0;font-size:24px}.wrap{max-width:1100px;margin:auto;padding:18px}.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:16px;margin-bottom:18px;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #0002}.card img{width:100%;height:210px;object-fit:contain}.info{padding:14px}.name{font-weight:bold;min-height:40px}.price{font-size:21px;font-weight:bold;color:#0b5cab;margin:8px 0}button{padding:11px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.add{width:100%;background:#ffb300}.cart{background:#fff;color:#0b5cab;margin-top:8px}footer{text-align:center;padding:25px;color:#555}
</style>
</head>
<body>
<header>
<h1>⚙️ PRAKASH Electrical & Refrigeration</h1>
<p>Spare Parts Online Store | Local Delivery</p>
<button class="cart" onclick="showCart()">🛒 Cart (<span id="count">0</span>)</button>
</header>
<div class="wrap">
<input class="search" id="search" placeholder="Search spare part..." oninput="render()">
<div class="grid" id="grid"></div>
</div>
<div id="box" style="display:none;position:fixed;inset:0;background:#0008;padding:25px">
<div style="background:#fff;max-width:500px;margin:auto;padding:20px;border-radius:12px">
<p><b>QR Scan karke payment karein</b></p>

  <p style="font-size:14px;color:#555">
    Payment ke baad payment screenshot WhatsApp par bhejna zaroori hai.
  </p>

  <label style="display:block;margin:12px 0">
    <input type="checkbox" id="paid">
    Maine payment kar di hai.
  </label>
</div>

<button style="width:100%;background:#25d366;color:white"
        onclick="whatsapp()">
  📱 Payment ke baad WhatsApp Order Karein
</button>

<button style="width:100%;margin-top:8px"
        onclick="document.getElementById('box').style.display='none'">
  Close
</button>
<button style="width:100%;background:#25d366;color:white" onclick="whatsapp()">Order on WhatsApp</button>
<button style="width:100%;margin-top:8px" onclick="document.getElementById('box').style.display='none'">Close</button>
</div></div>
<footer>Prakash Electrical & Refrigeration<br>WhatsApp: 8923987100</footer>
<script>
const products=[
["LG New Model Gear Box",400,"lg-new-gear-box.jpg"],
["LG Old Model Gear Box",400,"lg-old-gear-box.jpg"],
["LG Drain Valve Original",50,"lg-drain-valve-original.jpg"],
["EcoCare AC Foam Cleaner 600ml",200,"ecocare-ac-foam-cleaner.jpg"],
["Z Premium Compressor Oil Grade-68",240,"zpremium-compressor-oil.jpg"]
];
let cart=[];
function render(){
let q=document.getElementById("search").value.toLowerCase();
document.getElementById("grid").innerHTML=products.filter(p=>p[0].toLowerCase().includes(q)).map((p,i)=>`
<div class="card"><img src="${p[2]}" alt="${p[0]}"><div class="info"><div class="name">${p[0]}</div><div class="price">₹${p[1]}</div><button class="add" onclick="add(${i})">Add to Cart</button></div></div>`).join("");
}
function add(i){cart.push(products[i]);document.getElementById("count").textContent=cart.length;alert("Added to cart");}
function showCart(){
document.getElementById("box").style.display="block";
document.getElementById("items").innerHTML=cart.length?cart.map((p,i)=>`${i+1}. ${p[0]} — ₹${p[1]}<br>`).join(""):"Cart is empty";
document.getElementById("total").textContent=cart.reduce((s,p)=>s+p[1],0);
}
function whatsapp(){

if(!cart.length){
alert("Cart is empty");
return;
}

if(!document.getElementById("paid").checked){
alert("Please make the payment first and tick 'Maine payment kar di hai.'");
return;
}

let m = "Hello Prakash Electrical & Refrigeration,\n\n";
m += "I want to place a prepaid order:\n\n";

cart.forEach((p,i)=>{
m += `${i+1}. ${p[0]} - ₹${p[1]}\n`;
});

let total = cart.reduce((s,p)=>s+p[1],0);

m += `\nTotal Paid: ₹${total}`;
m += "\n\nPayment screenshot attached hai. Please confirm my order.";

let url = "https://wa.me/918923987100?text=" + encodeURIComponent(m);

window.open(url,"_blank");

}

let m = "Hello Prakash Electrical & Refrigeration,\n\n";
m += "I want to order:\n\n";

cart.forEach((p,i)=>{
m += `${i+1}. ${p[0]} - ₹${p[1]}\n`;
});

m += `\nTotal: ₹${cart.reduce((s,p)=>s+p[1],0)}`;

let url = "https://wa.me/918923987100?text=" + encodeURIComponent(m);

window.open(url,"_blank");

}
render();
</script>
</body>
</html>
