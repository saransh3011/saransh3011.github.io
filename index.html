<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Prakash Electrical & Refrigeration</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f7fa;
color:#222;
}

header{
background:#0b5cab;
color:white;
text-align:center;
padding:18px;
}

h1{
margin:0;
font-size:24px;
}

header p{
margin:8px 0;
}

.wrap{
max-width:1100px;
margin:auto;
padding:18px;
}

.search{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:9px;
font-size:16px;
margin-bottom:18px;
box-sizing:border-box;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
gap:16px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 10px #0002;
}

.card img{
width:100%;
height:210px;
object-fit:contain;
background:white;
}

.info{
padding:14px;
}

.name{
font-weight:bold;
min-height:40px;
}

.price{
font-size:21px;
font-weight:bold;
color:#0b5cab;
margin:8px 0;
}

button{
padding:11px;
border:0;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.add{
width:100%;
background:#ffb300;
}

.cart{
background:white;
color:#0b5cab;
margin-top:8px;
}

#box{
display:none;
position:fixed;
inset:0;
background:#0008;
padding:25px;
z-index:9999;
overflow:auto;
}

.modal{
background:white;
max-width:500px;
margin:30px auto;
padding:20px;
border-radius:12px;
}

.modal h2{
margin-top:0;
}

.cart-item{
padding:10px 0;
border-bottom:1px solid #ddd;
}

.total{
font-size:22px;
font-weight:bold;
margin:15px 0;
}

.whatsapp{
width:100%;
background:#25d366;
color:white;
}

.close{
width:100%;
margin-top:8px;
background:#ddd;
}

.loading{
text-align:center;
padding:40px;
font-size:18px;
}

.empty{
text-align:center;
padding:40px;
font-size:18px;
color:#666;
}

footer{
text-align:center;
padding:25px;
color:#555;
}

</style>
</head>


<body>


<header>

<h1>⚙️ PRAKASH Electrical & Refrigeration</h1>

<p>Spare Parts Online Store | Local Delivery</p>

<button class="cart" onclick="showCart()">

🛒 Cart (<span id="count">0</span>)

</button>

</header>



<div class="wrap">

<input
class="search"
id="search"
placeholder="Search spare part..."
oninput="render()"
>

<div id="grid" class="grid">

<div class="loading">
Loading products...
</div>

</div>

</div>



<!-- CART POPUP -->

<div id="box">

<div class="modal">

<h2>🛒 Your Cart</h2>

<div id="items"></div>

<div class="total">

Total: ₹<span id="total">0</span>

</div>


<p>
<b>Payment के बाद ही Order करें</b>
</p>

<p style="font-size:14px;color:#555">

Payment करने के बाद payment screenshot WhatsApp पर भेजना जरूरी है।

</p>


<label style="display:block;margin:15px 0">

<input type="checkbox" id="paid">

मैंने payment कर दी है।

</label>


<button
class="whatsapp"
onclick="whatsapp()">

📱 WhatsApp पर Order करें

</button>


<button
class="close"
onclick="closeCart()">

Close

</button>

</div>

</div>



<footer>

Prakash Electrical & Refrigeration

<br>

WhatsApp: 8923987100

</footer>



<script type="module">


/* =========================
   FIREBASE
========================= */

import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getFirestore,
collection,
getDocs
}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyAJmWqywbPJxZJN8x_w2HIWQ5lCdK",

authDomain: "prakash-electrical.firebaseapp.com",

projectId: "prakash-electrical",

storageBucket: "prakash-electrical.firebasestorage.app",

messagingSenderId: "122272936843",

appId: "1:122272936843:web:d7b31e9f5449bec368b58e",

measurementId: "G-S7Q8VF2J6W"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



/* =========================
   VARIABLES
========================= */

let products = [];

let cart = [];



/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

try{

const snapshot = await getDocs(
collection(db,"product")
);


products = [];


snapshot.forEach((doc)=>{

const data = doc.data();


let image = data.image || "";


/*
GitHub repository image
*/

if(image && !image.startsWith("http")){

image =
"https://raw.githubusercontent.com/" +
"saransh3011/saransh3011.github.io/main/" +
image;

}


products.push({

id:doc.id,

name:data.name || "Product",

price:Number(data.price) || 0,

image:image

});

});


render();


}catch(error){

console.error("Firebase Error:",error);


document.getElementById("grid").innerHTML = `

<div class="empty">

❌ Products load नहीं हो पाए।

<br><br>

Please try again.

</div>

`;

}

}



/* =========================
   SHOW PRODUCTS
========================= */

function render(){

const q =
document
.getElementById("search")
.value
.toLowerCase();


const filtered =
products.filter((p)=>{

return p.name
.toLowerCase()
.includes(q);

});


if(!filtered.length){

document.getElementById("grid").innerHTML = `

<div class="empty">

No products found.

</div>

`;

return;

}


document.getElementById("grid").innerHTML =

filtered.map((p)=>`

<div class="card">


<img

src="${p.image}"

alt="${p.name}"

onerror="this.src='https://via.placeholder.com/400x300?text=Product'"

>


<div class="info">


<div class="name">

${p.name}

</div>


<div class="price">

₹${p.price}

</div>


<button

class="add"

onclick="addToCart('${p.id}')">

Add to Cart

</button>


</div>

</div>

`).join("");

}



/* =========================
   ADD TO CART
========================= */

window.addToCart = function(id){

const product =
products.find((p)=>p.id === id);


if(!product){

return;

}


cart.push(product);


document.getElementById("count")
.textContent = cart.length;


alert("Product added to cart");

};



/* =========================
   SHOW CART
========================= */

window.showCart = function(){

document.getElementById("box")
.style.display = "block";


if(cart.length === 0){

document.getElementById("items").innerHTML = `

<div style="padding:20px;text-align:center">

🛒 Cart is empty

</div>

`;

}else{


document.getElementById("items").innerHTML =

cart.map((p,i)=>`

<div class="cart-item">

<b>${i+1}. ${p.name}</b>

<br>

₹${p.price}

</div>

`).join("");

}


document.getElementById("total")
.textContent =

cart.reduce(

(sum,p)=>sum+p.price,

0

);

};



/* =========================
   CLOSE CART
========================= */

window.closeCart = function(){

document.getElementById("box")
.style.display = "none";

};



/* =========================
   WHATSAPP ORDER
========================= */

window.whatsapp = function(){


if(cart.length === 0){

alert("Cart is empty");

return;

}


if(!document.getElementById("paid").checked){

alert(
"Please make payment first and tick the payment checkbox."
);

return;

}


let total =

cart.reduce(

(sum,p)=>sum+p.price,

0

);


let message =

"Hello Prakash Electrical & Refrigeration,\n\n";


message +=

"I want to order:\n\n";


cart.forEach((p,i)=>{

message +=

`${i+1}. ${p.name} - ₹${p.price}\n`;

});


message +=

`\nTotal: ₹${total}`;


message +=

"\n\nPayment Done. Please confirm my order.";


const url =

"https://wa.me/918923987100?text=" +

encodeURIComponent(message);


window.open(url,"_blank");

};



/* =========================
   START
========================= */

loadProducts();


</script>

</body>
</html>
