eight:700}.close{margin-top:8px;padding:10px;border:0;border-radius:8px}</style></head>

let cart=[];
function render(){let q=document.getElementById("search").value.toLowerCase();document.getElementById("grid").innerHTML=products.filter(p=>p[0].toLowerCase().includes(q)).map((p,i)=>`<div class="card"><div class="pic">${p[2]?`<img src="${p[2]}" alt="${p[0]}">`:`<span class="placeholder">⚙️</span>`}</div><h3>${p[0]}</h3><div class="price">₹${p[1]}</div><button class="add" onclick="add(${i})">Add to Cart</button></div>`).join("")}
function add(i){cart.push(i);update();alert("Added to cart")}function update(){document.getElementById("count").textContent=cart.length}

function closeCart(){document.getElementById("modal").style.display="none"}function sendOrder(){if(!cart.length){alert("Cart is empty");return}let n=document.getElementById("name").value.trim(),ph=document.getElementById("phone").value.trim(),a=document.getElementById("address").value.trim();if(!n||!ph||!a){alert("Please enter name, mobile and address");return}let c={};cart.forEach(i=>c[i]=(c[i]||0)+1);let t=0,m="New Order - Prakash Electrical & Refrigeration%0A%0A";Object.keys(c).forEach(i=>{let p=products[i],q=c[i];t+=p[1]*q;m+=`${p[0]} x ${q} = ₹${p[1]*q}%0A`});m+=`%0ATotal: ₹${t}%0A%0ACustomer: ${n}%0AMobile: ${ph}%0AAddress: ${a}`;window.open("https://wa.me/918923987100?text="+m,"_blank")}render();
</script></body></html>
